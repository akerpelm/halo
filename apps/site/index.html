<!doctype html>
<html lang="en" data-world="dichroic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--app-head-->
    <title>Halo: spring-physics toast and drawer for React</title>
    <!--/app-head-->
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('halo-site') || '{}');
        const theme = saved.theme === 'light' || saved.theme === 'dark' ? saved.theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const world = ['dichroic', 'partition', 'smoked', 'vapor', 'crystal', 'ink', 'opal', 'mercury', 'vellum', 'midnight'].includes(saved.world) ? saved.world : 'dichroic';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.world = world;
        if (theme !== 'light' || world !== 'dichroic') document.documentElement.dataset.booting = '';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
